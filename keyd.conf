# Colemak on the reMarkable Type Folio (QWERTY hardware) via keyd.
#
# The Qt app reads keyd's virtual keyboard and interprets emitted keycodes as
# US QWERTY (validated on-device). So each mapping is:
#
#   <LHS> = <RHS>
#     LHS = key by its QWERTY label (the physical key pressed)
#     RHS = key whose US-QWERTY glyph is the Colemak letter wanted there
#
# Keys that are identical in QWERTY and Colemak (q w a h z x c v b m , . /)
# are omitted -- unlisted keys pass through unchanged.
#
# Iterate live: `bin/keyd bind 'e = f'` ;  apply edits: `bin/keyd reload`.

[ids]
2edd:0001

[main]

# top row:  q w e r t y u i o p  ->  q w f p g j l u y ;
e = f
r = p
t = g
y = j
u = l
i = u
o = y
p = ;

# home row:  a s d f g h j k l ;  ->  a r s t d h n e i o
s = r
d = s
f = t
g = d
j = n
k = e
l = i
; = o

# bottom row:  z x c v b n m , . /  ->  z x c v b k m , . /
n = k

# Caps Lock is dead weight on a keyboard this small. Escape is the editor
# convention; swap this for `capslock = backspace` for the Colemak one.
capslock = esc
